# Builds and publishes Android and iOS apps when the version in pubspec.yaml
# changes. Bump `version:` (e.g. 0.0.1 -> 0.0.2), push, and a GitHub Release
# tagged v0.0.2 appears with the APK, App Bundle and iOS build attached.
# Pushes that keep the same version do nothing (the tag already exists).
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Read version and decide whether to release
        run: |
          raw=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//')
          name="${raw%%+*}"
          if ! [[ "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::pubspec.yaml version '$raw' must look like 1.2.3 or 1.2.3+4"
            exit 1
          fi
          # Android versionCode must always increase; derive it from the version
          # so 0.0.1 -> 1, 0.0.2 -> 2, 1.2.3 -> 1002003.
          code=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          if [ "$code" -lt 1 ]; then code=1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$name" >/dev/null; then
            echo "Tag v$name already exists: nothing to release."
            release=false
          else
            echo "New version $name (build $code): releasing."
            release=true
          fi
          {
            echo "name=$name"
            echo "code=$code"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Analyze and test
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    name: Build Android
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      NAME: ${{ needs.version.outputs.name }}
      CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK will be signed with a DEBUG key and cannot be published to Google Play."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get
      - run: flutter build apk --release --build-name="$NAME" --build-number="$CODE"
      - run: flutter build appbundle --release --build-name="$NAME" --build-number="$CODE"

      - name: Rename outputs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/splitmate-$NAME.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/splitmate-$NAME.aab"

      - name: Remove signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  ios:
    name: Build iOS
    needs: [version, test]
    runs-on: macos-latest
    env:
      NAME: ${{ needs.version.outputs.name }}
      CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # Unsigned: installing on an iPhone needs re-signing (Xcode, AltStore,
      # Sideloadly) or Apple Developer signing; see README "Automatic releases".
      - run: flutter build ios --release --no-codesign --build-name="$NAME" --build-number="$CODE"

      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (cd dist && zip -qr "splitmate-$NAME-ios-unsigned.ipa" Payload && rm -rf Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa

  release:
    name: Publish GitHub Release
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    env:
      NAME: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.name }}
          name: SplitMate ${{ needs.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            ## SplitMate ${{ needs.version.outputs.name }}

            | File | Use |
            | --- | --- |
            | `splitmate-${{ needs.version.outputs.name }}.apk` | Install directly on Android |
            | `splitmate-${{ needs.version.outputs.name }}.aab` | Upload to Google Play |
            | `splitmate-${{ needs.version.outputs.name }}-ios-unsigned.ipa` | iOS build; must be re-signed before it can be installed |

            Built automatically from ${{ github.sha }}.
